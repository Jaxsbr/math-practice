# Build Loop — Progress State
# Schema: config + state read every iteration. Validate with yamllint.

config:
  verify: "npx tsc --noEmit && npm run lint && npm test"
  max_tasks_per_phase: 200
  quality_check_suppressions: []
  build_loop_version:
    init_version: 9
    builds: [9, 11, 12]

state:
  task_number: 15
  phase: reward-magic
  phase_complete: true
  review_stage: null
  review_complete: false
  retro_complete: false
  pr_number: null
  status: running
  last_result: pass
  next_task: null
  consecutive_fails: 0
  completed_stories: [US-12, US-13, US-14, US-15, US-16]
